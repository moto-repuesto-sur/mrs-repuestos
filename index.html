<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRS Racing - Repuestos para Motos</title>
    <style>
        body { background-color: #ffffff; color: #333333; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background-color: #030712; padding: 0; border-bottom: 4px solid #facc15; }
        .banner-img { width: 100%; height: auto; display: block; max-height: 250px; object-fit: cover; }
        .search-container { max-width: 600px; margin: 15px auto; padding: 0 15px; position: relative; }
        .search-input { width: 100%; padding: 12px 40px 12px 15px; border: 1px solid #cccccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; background-color: #f9f9f9; }
        .search-icon { position: absolute; right: 25px; top: 12px; color: #888; font-size: 14px; }
        .nav-categories { display: flex; gap: 20px; overflow-x: auto; padding: 12px 15px; border-bottom: 1px solid #e5e7eb; white-space: nowrap; scrollbar-width: none; }
        .nav-categories::-webkit-scrollbar { display: none; }
        .nav-link { color: #222222; text-decoration: none; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        .nav-link.home-btn { color: #2563eb; border-bottom: 2px solid #2563eb; padding-bottom: 2px; }
        .results-title { padding: 20px 15px 5px 15px; max-width: 1200px; margin: 0 auto; }
        .results-title h2 { font-size: 20px; margin: 0 0 5px 0; color: #111; font-weight: bold; }
        .results-count { font-size: 13px; color: #666; margin: 0; }
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px; max-width: 1200px; margin: 0 auto; }
        @media (min-width: 768px) { .products-grid { grid-template-columns: repeat(4, 1fr); } }
        .product-card { background: #ffffff; display: flex; flex-direction: column; justify-content: space-between; border-radius: 4px; }
        .image-container { background-color: #f6f6f6; border-radius: 8px; padding: 15px; text-align: center; display: flex; align-items: center; justify-content: center; aspect-ratio: 1 / 1; margin-bottom: 10px; }
        .image-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .product-info { padding: 0 5px; }
        .prod-title { font-size: 11px; color: #444444; text-transform: uppercase; font-weight: bold; margin: 0 0 5px 0; line-height: 1.3; min-height: 28px; }
        .prod-price { font-size: 15px; color: #111111; font-weight: bold; margin: 0 0 10px 0; }
        .buy-btn { display: block; background-color: #facc15; color: #000000; text-align: center; padding: 10px 0; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; transition: background-color 0.2s; }
        footer { background-color: #f9f9f9; padding: 25px; text-align: center; margin-top: 40px; border-top: 1px solid #e5e7eb; font-size: 12px; color: #666; }
    </style>
</head>
<body>

    <header>
        <!-- Tu imagen vinculada con el nombre de celular -->
        <img src="IMG-20261001-WA0077.jpg" alt="MRS Racing Banner" class="banner-img">
        <div class="search-container">
            <input type="text" placeholder="¿Qué repuesto estás buscando?..." class="search-input">
            <span class="search-icon">🔍</span>
        </div>
    </header>

    <nav class="nav-categories">
        <a href="./inicio.html" class="nav-link home-btn">🏠 INICIO</a>
        <a href="#" class="nav-link">Motor</a>
        <a href="#" class="nav-link">Frenos</a>
        <a href="#" class="nav-link">Transmisión</a>
        <a href="#" class="nav-link">Accesorios</a>
    </nav>

    <div class="results-title">
        <h2>Resultados de búsqueda</h2>
        <p class="results-count">Mostrando repuestos destacados</p>
    </div>

    <main class="products-grid">
        <div class="product-card">
            <div class="image-container">
                <img src="https://placeholder.com" alt="Bobina">
            </div>
            <div class="product-info">
                <h3 class="prod-title">BOBINA ALTA H. TITAN 150</h3>
                <p class="prod-price">$5.496,50</p>
                <a href="https://wa.me" target="_blank" class="buy-btn">Comprar</a>
            </div>
        </div>
        <div class="product-card">
            <div class="image-container">
                <img src="https://placeholder.com" alt="Bobina">
            </div>
            <div class="product-info">
                <h3 class="prod-title">BOBINA ALTA H. XR 150</h3>
                <p class="prod-price">$8.237,75</p>
                <a href="https://wa.me" target="_blank" class="buy-btn">Comprar</a>
            </div>
        </div>
    </main>

    <footer>
        <p><strong>⚡ MRS Racing - Repuestos para Motos</strong></p>
        <p>&copy; 2026 Catálogo Digital conectado a WhatsApp</p>
    </footer>

</body>
</html>
